# Windows・Linux・macOS 向けの配布物を作る。手動(workflow_dispatch)か、v で始まるタグの push で動く。
# 出来た配布物は、実行結果のページの Artifacts からダウンロードする。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 古い glibc でも動くよう、なるべく古い Ubuntu でビルドする
          - os: ubuntu-22.04
            bundles: deb,appimage
          # Intel と Apple Silicon の両方で動くユニバーサル版。署名はアドホック(tauri.conf.json の signingIdentity "-")
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 版は mise.toml と同じにする
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux のビルドに要るパッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci
      - run: cargo test --workspace
      - run: npm test
      - run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: wphi-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
