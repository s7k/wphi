# Windows・Linux・macOS 向けの配布物を作る。手動(workflow_dispatch)か、v で始まるタグの push で動く。
# 出来た配布物は、実行結果のページの Artifacts からダウンロードする。タグの push の時は Releases にも置く。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Release を作って配る物を置く為
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            package: windows
          # 古い glibc でも動くよう、なるべく古い Ubuntu でビルドする
          - os: ubuntu-22.04
            bundles: deb,appimage
            package: linux
          # Intel と Apple Silicon の両方で動くユニバーサル版。署名はアドホック(tauri.conf.json の signingIdentity "-")
          - os: macos-latest
            bundles: app,dmg
            package: macos
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 版は mise.toml と同じにする
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux のビルドに要るパッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci
      - run: cargo test --workspace
      - run: npm test
      - run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      # 展開してそのまま使える zip(アプリと空の chara・chip と README.txt)
      - name: zip にまとめる
        shell: bash
        run: tools/package.sh ${{ matrix.package }}

      # 配る物を out に集め、階層を無くす(Artifacts と Releases に同じ物を置く)
      - name: 配る物を集める
        shell: bash
        run: |
          mkdir -p out
          cp dist-zip/*.zip out/
          for f in target/release/bundle/nsis/*.exe target/release/bundle/deb/*.deb \
                   target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] && cp "$f" out/
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wphi-${{ matrix.package }}
          path: out/*
          if-no-files-found: error

      # タグの push の時は、そのタグの Release に置く(無ければ作る)
      - name: Release に置く
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "WPHI ${GITHUB_REF_NAME#v}" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
