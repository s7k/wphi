# push と pull request のたびに、整形・lint・テストを確かめる。配布物は作らない(build.yml)。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 版は mise.toml と同じにする
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Linux のビルドに要るパッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # Windows と macOS は大文字と小文字を区別しないので、tagMenu.ts と TagMenu.tsx のように拡張子の前が
      # 大文字と小文字だけ違うと、拡張子を省いた import が別のファイルを読む(v0.1.5 の Windows・macOS のビルドが落ちた)
      - name: 大文字と小文字だけ違うファイル名が無いか
        run: |
          dup=$(git ls-files ui/src | sed 's/\.[^./]*$//' | sort -u | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dup" ]; then echo "$dup"; exit 1; fi
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npx tsc --noEmit
      - run: npm test
