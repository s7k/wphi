[package]
name = "wphi"
version = "0.1.20"
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
phi-proto = { path = "../crates/phi-proto" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
keyring = "4.2"
fancy-regex = "0.14"
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
serde_json = "1"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# 接続の遅延 ACK を切る為だけに使う(session.rs の tune)
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
# wry が切った IME の preedit を戻す為だけに使う。wry と同じ版にする
webkit2gtk = "2.0"
