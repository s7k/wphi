<?xml version="1.0" encoding="UTF-8"?>
<!-- WPHI のアプリアイコン。金属の縁で内側が赤いヒーターシールドに、翼を広げたドラゴンの白いシルエット。
     icon.png などはこの SVG から作る(README の「アイコンの作り直し」) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 金属の縁: 左上から光が当たる銀 -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.35" stop-color="#b9c0c8"/>
      <stop offset="0.55" stop-color="#e2e6ea"/>
      <stop offset="0.8" stop-color="#8a929c"/>
      <stop offset="1" stop-color="#5d646d"/>
    </linearGradient>
    <!-- 内側の赤: 中心が明るく、縁へ向けて暗い -->
    <radialGradient id="red" cx="0.45" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#e2302c"/>
      <stop offset="0.6" stop-color="#a8141a"/>
      <stop offset="1" stop-color="#5e070c"/>
    </radialGradient>
    <!-- 盾の形(上辺は平ら、下は尖る) -->
    <path id="outer" d="M 168 120 L 856 120 Q 880 120 880 144 L 880 470
                        C 880 700 720 860 512 948 C 304 860 144 700 144 470 L 144 144 Q 144 120 168 120 Z"/>
    <path id="inner" d="M 214 170 L 810 170 Q 828 170 828 188 L 828 472
                        C 828 670 690 806 512 884 C 334 806 196 670 196 472 L 196 188 Q 196 170 214 170 Z"/>
  </defs>

  <!-- 金属の縁 -->
  <use href="#outer" fill="url(#metal)" stroke="#3a3f46" stroke-width="10"/>
  <!-- 内側の赤 -->
  <use href="#inner" fill="url(#red)" stroke="#2c0306" stroke-width="8"/>
  <!-- 縁の内側の照り返し -->
  <use href="#inner" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" transform="translate(0 6)"/>

  <!-- ドラゴン(白いシルエット)。翼を広げて正面に構え、翼の先・翼の一番下の指・頭を結ぶ輪郭を W にする(WPHI の W)。
       W の中央の山の下は赤のまま空ける。頭は右向きの横顔 -->
  <!-- 尾。胸の下から細くなりながら右の翼の内側へ入り、翼の奥へ流れて見える。翼の下に描く -->
  <path d="M 498 482 C 494 548 520 610 604 640 C 598 628 596 616 600 604 C 548 588 528 540 526 482 Z" fill="#ffffff"/>
  <g fill="#ffffff">
    <!-- 左の翼。肩から翼の先へ上がり、指の先を下りて一番下の指へ、そこから肩へまっすぐ戻る -->
    <path d="M 494 432 C 432 362 334 272 232 194
             C 254 296 250 356 234 418 C 290 418 316 468 310 528
             C 360 526 392 588 384 656 C 404 668 414 700 384 728
             C 420 640 462 540 500 478 Z"/>
    <!-- 右の翼 -->
    <path d="M 530 432 C 592 362 690 272 792 194
             C 770 296 774 356 790 418 C 734 418 708 468 714 528
             C 664 526 632 588 640 656 C 620 668 610 700 640 728
             C 604 640 562 540 524 478 Z"/>
    <!-- 肩と胸(W の中央の山の根元) -->
    <path d="M 484 428 C 482 456 492 478 512 492 C 532 478 542 456 540 428 Z"/>
    <!-- 首と頭(右向き)。首は肩から上がり、頭が W の中央の山になる -->
    <path d="M 488 436 C 482 384 486 336 506 300 C 516 282 534 268 556 262
             C 582 256 610 258 640 266 C 652 270 652 284 640 286 L 604 290
             C 590 292 580 300 576 312 C 558 330 548 356 546 390 C 544 408 542 424 540 436 Z"/>
    <!-- 後ろへ伸びる角 -->
    <path d="M 540 268 L 500 236 L 560 260 Z"/>
    <path d="M 556 264 L 528 224 L 576 260 Z"/>
  </g>
  <!-- 目 -->
  <circle cx="586" cy="272" r="6" fill="#8e1016"/>
</svg>
